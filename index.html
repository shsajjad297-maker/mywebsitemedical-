<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sajjad's Website</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{

background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);

min-height:100vh;

color:white;

}

/* Logo */

.logo{

position:absolute;

top:20px;

left:30px;

font-size:28px;

font-weight:bold;

}

/* Main Container */

.container{

width:90%;

max-width:900px;

margin:100px auto;

background:rgba(255,255,255,0.12);

padding:35px;

border-radius:20px;

backdrop-filter:blur(10px);

box-shadow:0px 10px 25px rgba(0,0,0,.4);

}

/* Tabs */

.tabs{

display:flex;

justify-content:center;

gap:15px;

margin-bottom:25px;

}

.tab-button{

background:#ffffff22;

border:none;

padding:12px 25px;

font-size:18px;

color:white;

cursor:pointer;

border-radius:10px;

transition:.3s;

}

.tab-button:hover{

background:#00bcd4;

}

.content{

display:none;

animation:fade .5s;

}

.content.active{

display:block;

}

@keyframes fade{

from{opacity:0;}

to{opacity:1;}

}

h2{

text-align:center;

margin-bottom:20px;

}

.link-btn{

display:block;

width:320px;

margin:15px auto;

padding:15px;

text-align:center;

text-decoration:none;

background:#00BCD4;

color:white;

border-radius:10px;

font-size:18px;

font-weight:bold;

transition:.3s;

}

.link-btn:hover{

background:#0097A7;

transform:scale(1.03);

}

/* Footer */

footer{

text-align:center;

padding:30px;

font-size:18px;

margin-top:60px;

color:white;

}

</style>

</head>

<body>

<div class="logo">

🩺 Sajjad's Website

</div>

<div class="container">

<div class="tabs">

<button class="tab-button" onclick="showTab('anatomy')">Anatomy</button>

<button class="tab-button" onclick="showTab('physiology')">Physiology</button>

<button class="tab-button" onclick="showTab('biochemistry')">Biochemistry</button>

</div>

<!-- Anatomy -->

<div id="anatomy" class="content active">

<h2>Click below to see the YouTube class</h2>

<a class="link-btn"
href="https://www.youtube.com/@WELIKEANATOMY"
target="_blank">

We Like Anatomy

</a>

<a class="link-btn"
href="https://www.youtube.com/@dr.chandonaseasiestanatomy461"
target="_blank">

Dr. Chondona Sarkar

</a>

</div>

<!-- Physiology -->

<div id="physiology" class="content">

<h2>Click below to see the YouTube class</h2>

<a class="link-btn"
href="https://www.youtube.com/@tajwarhasnatthuha4937/playlists"
target="_blank">

Tajwar Hasnat Thuha

</a>

</div>

<!-- Biochemistry -->

<div id="biochemistry" class="content">

<h2>Click below to see the YouTube class</h2>

<a class="link-btn"
href="https://www.youtube.com/@tajwarhasnatthuha4937/playlists"
target="_blank">

Tajwar Hasnat Thuha

</a>

</div>

</div>

<footer>

<b>Sylhet Osmani Medical College</b><br>

4th Year Medical Student

</footer>

<script>

function showTab(tabId){

var tabs=document.getElementsByClassName("content");

for(var i=0;i<tabs.length;i++){

tabs[i].classList.remove("active");

}

document.getElementById(tabId).classList.add("active");

}

</script>

</body>

</html>
